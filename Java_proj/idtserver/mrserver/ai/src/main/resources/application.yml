spring:
  application:
    name: AIModuleServer
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    locale: zh_CN
    time-zone: GMT+8
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auto_label_detection?&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:a1234567}
    driver-class-name: org.postgresql.Driver
  redis:
    database: 0
    port: 6379
    host: localhost
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1000MB
server:
  port: 83

mybatis:
  mapper-locations: classpath:mapper/*.xml
  #用于mybatis在控制台打印sql日志
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

pagehelper:
  helper-dialect: postgresql
  reasonable: true
  support-methods-arguments: true


# Store uploads under the project by default so the application is portable and
# does not depend on write permission for a machine-specific drive path.
resources-path: ${RESOURCES_PATH:static}
models-path: modelFiles
pics-path: pics2Train
original-file-path: originalFiles
python-command: python
yolo-model-path: ${YOLO_MODEL_PATH:yolov8n.pt}
camera-watch-path: ${CAMERA_WATCH_PATH:cameraInbox}
camera-results-path: ${CAMERA_RESULTS_PATH:static/cameraResults}
camera-confidence: ${CAMERA_CONFIDENCE:0.25}
camera-scan-interval: ${CAMERA_SCAN_INTERVAL:2}

