server:
  port: 80

spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: AuthServer
          uri: http://localhost:81
          predicates:
            - Path=/AuthServer/**
          filters:
            - StripPrefix=1
        - id: UserServer
          uri: http://localhost:82
          predicates:
            - Path=/UserServer/**
          filters:
            - StripPrefix=1
        - id: AIModuleServer
          uri: http://127.0.0.1:83
          predicates:
            - Path=/AIModuleServer/**
          filters:
            - StripPrefix=1
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auto_label_detection}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:a1234567}
    driver-class-name: org.postgresql.Driver
  redis:
    database: 0
    port: 6379
    host: localhost

exclusion:
  url:
    - /AIModuleServer/FileManager/*
    - /AIModuleServer/ModelCenter/*
    - /AIModuleServer/TaskCenter/*
    - /goods-center/goods/detail
    - /AuthServer/login
